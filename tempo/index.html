<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsão do tempo — Porto Alegre</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="painel" role="region" aria-labelledby="titulo">
        <div id="cabecalho" class="cabecalho">
            <span class="icone sol" aria-hidden="true">☀</span>
            <h1 id="titulo">Previsão do tempo</h1>
            <p><span class="hoje">Hoje</span>Porto Alegre - RS</p>
        </div>
        <div class="card temperatura">
            <span class="icone" aria-hidden="true">☀</span>
            <span>Temperatura</span>
            <strong>26°C</strong>
        </div>
        <div class="card umidade">
            <span class="icone" aria-hidden="true">💧&#65038;</span>
            <span>Umidade</span>
            <strong>65%</strong>
        </div>
        <div class="card vento">
            <span class="icone" aria-hidden="true">≋</span>
            <span>Vento</span>
            <strong>12 km/h</strong>
        </div>
        <div class="card condicao">
            <span class="icone" aria-hidden="true">☁</span>
            <span>Condição</span>
            <strong>Ensolarado</strong>
        </div>
        <div class="card amanha">
            <span class="icone" aria-hidden="true">▦</span>
            <span>Amanhã</span>
            <strong>25°C</strong>
        </div>
        <div class="card localizacao">
            <span class="icone" aria-hidden="true">📍&#65038;</span>
            <span>Localização</span>
            <strong>Porto Alegre</strong>
        </div>
    </div>
</body>
</html>
